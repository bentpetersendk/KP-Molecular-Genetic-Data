    ERR1044272), open access without restrictions, trimmed in the NGS preprocessing practical.
    PAO1 genome and annotation: NCBI RefSeq NC_002516.2 (Stover et al. 2000, Nature 406:959),
    no restrictions on use; the FASTA header and the gene table were reformatted for the course.
