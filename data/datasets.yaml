    size_bytes: 76820965
    sha256: 4d7c086ebfb598bdfc4aea9863ee2dc8ff8655ba20e99ea67677131c9b3d0862
  - filename: HG00418_trimmed_reverse
    description: "Human (1000 Genomes sample HG00418), read pairs from chromosome 21 after Trimmomatic - reverse reads"
