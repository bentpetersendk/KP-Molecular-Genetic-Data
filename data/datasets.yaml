- id: unix-command-line
  title: The Unix command line
  exercise: exercises/unix-command-line/index.md
  # Shared Galaxy Europe history containing exactly these two files.
  galaxy_history_url: "https://usegalaxy.eu/u/bentpetersen/h/kp-unix-command-line-data"
  archive_url: ""
  redistribution: >-
    Data from UniProtKB/Swiss-Prot (UniProt Consortium, release 2026_03), licensed
    under CC BY 4.0 (https://www.uniprot.org/help/license). Selected and reformatted
    for teaching: a panel of human disease genes and their orthologs in other vertebrates.
  files:
  - filename: proteins.tsv
    description: "Reviewed UniProtKB/Swiss-Prot entries for a panel of human disease genes and their orthologs in other vertebrates (accession, entry name, gene name, organism, protein length)"
    technology: UniProtKB/Swiss-Prot table export
    layout: tab-separated table with a header line
    galaxy_datatype: tabular
    size_bytes: 4437
    sha256: fb49c8b42f995b4615413516f24b27e4a540ecce7fa0e7d346f8a63c442e3c7e
  - filename: proteins.fasta
    description: "Protein sequences of the same entries, with UniProt FASTA headers"
    technology: UniProtKB/Swiss-Prot FASTA export
    layout: FASTA
    galaxy_datatype: fasta
    size_bytes: 97479
    sha256: cfd3c3f805b17257539a25da2c71b036e788989ae020d7116f7f2e18d2594b43

- id: read-mapping-variant-calling
  title: Read mapping and variant calling
  exercise: exercises/read-mapping-variant-calling/index.md
  # Shared Galaxy Europe history containing exactly these files and the HG00418_trimmed paired collection.
  galaxy_history_url: "https://usegalaxy.eu/u/bentpetersen/h/kp-read-mapping-and-variant-calling-data"
  # Optional history with only the cleaned reads (Paeruginosa.cut.trim and the HG00418_trimmed paired collection).
  prepared_reads_history_url: "https://usegalaxy.eu/u/bentpetersen/h/kp-molecular-genetic-data-prepared-illumina-reads"
  archive_url: ""
  redistribution: >-
    P. aeruginosa reads: public ENA data, run ERR706017 (Andersen et al. 2015, PNAS 112:10756),
    trimmed in the NGS preprocessing practical. HG00418 reads: 1000 Genomes Project data (ENA run
    ERR1044272), open access without restrictions, trimmed in the NGS preprocessing practical.
    PAO1 genome and annotation: NCBI RefSeq NC_002516.2 (Stover et al. 2000, Nature 406:959),
    no restrictions on use; the FASTA header and the gene table were reformatted for the course.
  files:
  - filename: Paeruginosa.cut.trim
    description: "Pseudomonas aeruginosa clinical isolate (Danish cystic fibrosis lineage DK01), reads after Cutadapt and Trimmomatic as in the NGS preprocessing practical"
